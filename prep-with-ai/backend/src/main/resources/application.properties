spring.application.name=prep-with-ai

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/prepwithai
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=YOUR_JWT_SECRET_CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS!!
app.jwt.expiration-ms=86400000

# Groq
app.groq.api-key=${GROQ_API_KEY:}
app.groq.api-url=https://api.groq.com/openai/v1/chat/completions
app.groq.model=llama-3.3-70b-versatile

# CORS
app.cors.allowed-origins=http://localhost:3000
